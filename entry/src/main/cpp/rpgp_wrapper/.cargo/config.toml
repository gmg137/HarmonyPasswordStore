[target.aarch64-unknown-linux-ohos]
linker = "/home/gmg/.deveco-cli-clt/sdk/default/openharmony/native/llvm/bin/aarch64-unknown-linux-ohos-clang"
rustflags = [
  "-C", "link-arg=--sysroot=/home/gmg/.deveco-cli-clt/sdk/default/openharmony/native/sysroot",
  "-C", "link-arg=-fuse-ld=lld",
]

[target.x86_64-unknown-linux-ohos]
linker = "/home/gmg/.deveco-cli-clt/sdk/default/openharmony/native/llvm/bin/x86_64-unknown-linux-ohos-clang"
rustflags = [
  "-C", "link-arg=--sysroot=/home/gmg/.deveco-cli-clt/sdk/default/openharmony/native/sysroot",
  "-C", "link-arg=-fuse-ld=lld",
]

# ring 等带 C/汇编代码的 crate 通过 cc crate 编译，必须用 OHOS clang
# （否则用系统 cc，产出 glibc ABI 对象，链接 .so 时报 incompatible with aarch64linux）
[env]
CC_aarch64-unknown-linux-ohos = "/home/gmg/.deveco-cli-clt/sdk/default/openharmony/native/llvm/bin/aarch64-unknown-linux-ohos-clang"
AR_aarch64-unknown-linux-ohos = "/home/gmg/.deveco-cli-clt/sdk/default/openharmony/native/llvm/bin/llvm-ar"
CFLAGS_aarch64-unknown-linux-ohos = "--sysroot=/home/gmg/.deveco-cli-clt/sdk/default/openharmony/native/sysroot"
CC_x86_64-unknown-linux-ohos = "/home/gmg/.deveco-cli-clt/sdk/default/openharmony/native/llvm/bin/x86_64-unknown-linux-ohos-clang"
AR_x86_64-unknown-linux-ohos = "/home/gmg/.deveco-cli-clt/sdk/default/openharmony/native/llvm/bin/llvm-ar"
CFLAGS_x86_64-unknown-linux-ohos = "--sysroot=/home/gmg/.deveco-cli-clt/sdk/default/openharmony/native/sysroot"

# 这里曾放有 [unstable] build-std / build-std-features = ["panic_immediate_abort"]，
# 但 -Zbuild-std 只在 nightly 生效，stable 下该段被静默忽略（产物 nm 可见 _Unwind_Resume，
# 说明 std 仍是 unwind 版），于是形成「配置声称 panic=abort、实际是 unwind」的假象。
# 现改为在 Cargo.toml 的 [profile.release] 显式声明，对 stable 同样生效；
# panic 向外传播则由 lib.rs 的 ffi_guard 统一转成错误返回，不再跨越 FFI 边界。
